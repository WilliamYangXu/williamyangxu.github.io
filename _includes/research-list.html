<div class="research-list">
  {% for paper in site.data.papers %}
  <article class="paper" id="{{ paper.id }}" aria-labelledby="{{ paper.id }}-title">
    <div class="paper-details">
      <h3 id="{{ paper.id }}-title"><a href="{{ paper.url | escape }}">{{ paper.title | escape }}</a></h3>
      <div class="paper-authors">{{ paper.authors | markdownify }}</div>
      <div class="paper-meta">
        <p class="paper-venue"><em>{{ paper.venue | escape }}</em>, {{ paper.year }}{% if paper.preprint %} <span class="preprint">· Preprint</span>{% endif %}</p>
        <span class="meta-divider" aria-hidden="true">/</span>
        <a href="{{ paper.url | escape }}" aria-label="Read {{ paper.title | escape }}">Paper</a>
      </div>
      {% if paper.summary %}<p class="paper-summary">{{ paper.summary | escape }}</p>{% endif %}
    </div>
  </article>
  {% endfor %}
</div>
