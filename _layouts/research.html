<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff">
    <title>{% if page.url != '/' %}{{ page.title | escape }} · {% endif %}{{ site.name | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ site.name | escape }}{% if page.url != '/' %} · {{ page.title | escape }}{% endif %}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <script src="{{ '/assets/js/research-theme.js' | relative_url }}"></script>
    <link rel="stylesheet" href="{{ '/assets/css/research.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <main id="main" class="site-content">
      <div class="page-tools">
        {% if page.url != '/' %}
        <a class="home-link" href="{{ '/' | relative_url }}">William Yang Xu</a>
        {% endif %}
        <button class="theme-toggle" type="button" aria-pressed="false" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z" stroke-linejoin="round"/></svg>
          <span>Dark mode</span>
        </button>
      </div>
      {{ content }}
    </main>
    <footer class="site-footer">William Yang Xu</footer>
  </body>
</html>
